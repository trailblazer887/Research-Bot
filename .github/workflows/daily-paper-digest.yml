name: daily-paper-digest

on:
  schedule:
    # 01:30 UTC = 09:30 Asia/Shanghai，周一到周六
    - cron: "30 1 * * 1-6"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily 或 venue"
        type: choice
        options: [daily, venue]
        default: daily
      limit:
        description: "可选：本次最多推几篇（测试用，留空 = 5）"
        default: ""

permissions:
  contents: write

concurrency:
  group: paper-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: paper-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: paper-bot/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Self-test
        run: python main.py --self-test

      - name: Resolve args
        id: args
        env:
          INPUT_MODE: ${{ github.event.inputs.mode || 'daily' }}
          INPUT_LIMIT: ${{ github.event.inputs.limit || '' }}
        run: |
          MODE="${INPUT_MODE:-daily}"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          case "$INPUT_LIMIT" in
            ""|*[!0-9]*) echo "limit=" >> "$GITHUB_OUTPUT" ;;
            *) echo "limit=--limit $INPUT_LIMIT" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run
        env:
          QMSG_KEY: ${{ secrets.QMSG_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python main.py --mode "${{ steps.args.outputs.mode }}" ${{ steps.args.outputs.limit }}

      - name: Persist state
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p paper-bot/data
          git add paper-bot/data/
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "chore: digest $(date -u +%F)"
            git push
          fi
