name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: paper-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: paper-bot/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Self-test
        run: python main.py --self-test

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
